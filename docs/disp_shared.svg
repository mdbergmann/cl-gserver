<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 400" width="1344" height="800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="filled" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
    <marker id="hollow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="white" stroke="black" stroke-width="1"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="1.5" dy="1.5" stdDeviation="0.6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="672" height="400" fill="white"/>

  <!-- note -->
  <g filter="url(#shadow)">
    <path d="M 6 100 H 232 L 258 126 V 318 H 6 Z" fill="#ffffc8" stroke="black" stroke-width="1"/>
    <path d="M 232 100 V 126 H 258" fill="none" stroke="black" stroke-width="1"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="black">
    <text x="132" y="121">:shared</text>
    <text x="132" y="145">enqueue / schedule / run:</text>
    <text x="132" y="169">Senders enqueue into the actor's queue.</text>
    <text x="132" y="183">Only the sender that finds the message-box</text>
    <text x="132" y="197">idle marks it scheduled and dispatches one</text>
    <text x="132" y="211">run to a Dispatcher Worker, all others</text>
    <text x="132" y="225">just enqueue. The run pops and handles</text>
    <text x="132" y="239">up to 'throughput' messages with the actor's</text>
    <text x="132" y="253">message handling, protected by a lock, then</text>
    <text x="132" y="267">marks the message-box idle and reschedules</text>
    <text x="132" y="281">it only if messages remain.</text>
    <text x="132" y="303">One worker at a time runs an actor.</text>
  </g>

  <!-- arrows: senders -> receiver -->
  <g stroke="black" stroke-width="1" fill="none" marker-end="url(#filled)">
    <line x1="220" y1="330" x2="392" y2="238"/>
    <line x1="352" y1="330" x2="408" y2="238"/>
    <line x1="482" y1="330" x2="426" y2="238"/>
    <line x1="614" y1="330" x2="442" y2="238"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="292" y="296">&lt;&lt;enqueue&gt;&gt;</text>
    <text x="368" y="278">&lt;&lt;enqueue&gt;&gt;</text>
    <text x="462" y="296">&lt;&lt;enqueue&gt;&gt;</text>
    <text x="548" y="278">&lt;&lt;enqueue&gt;&gt;</text>
  </g>

  <!-- arrow: receiver -> dispatcher (schedule, once per burst) -->
  <line x1="417" y1="200" x2="417" y2="134" stroke="black" stroke-width="1" marker-end="url(#filled)"/>
  <g font-size="10" text-anchor="end">
    <text x="410" y="160">&lt;&lt;schedule&gt;&gt;</text>
    <text x="410" y="173" font-size="9">once, when idle</text>
  </g>

  <!-- arrows: dispatcher -> workers (route) -->
  <line x1="402" y1="96" x2="362" y2="42" stroke="black" stroke-width="1" marker-end="url(#filled)"/>
  <line x1="432" y1="96" x2="472" y2="42" stroke="black" stroke-width="1" marker-end="url(#filled)"/>
  <text x="370" y="66" font-size="10" text-anchor="end">&lt;&lt;route&gt;&gt;</text>
  <text x="464" y="66" font-size="10" text-anchor="start">&lt;&lt;route&gt;&gt;</text>

  <!-- arrow: worker -> receiver (run) -->
  <path d="M 512 40 C 660 110, 640 240, 464 220" stroke="black" stroke-width="1" fill="none" marker-end="url(#hollow)"/>
  <g font-size="10" text-anchor="middle">
    <text x="528" y="176">&lt;&lt;run&gt;&gt;</text>
    <text x="528" y="189" font-size="9">pop &amp; handle</text>
    <text x="528" y="201" font-size="9">up to throughput msgs</text>
  </g>

  <!-- arrow: worker -> dispatcher (reschedule) -->
  <path d="M 500 40 C 560 40, 600 110, 464 120" stroke="black" stroke-width="1" fill="none" stroke-dasharray="4 3" marker-end="url(#filled)"/>
  <g font-size="10" text-anchor="middle">
    <text x="618" y="74">&lt;&lt;reschedule&gt;&gt;</text>
    <text x="618" y="86" font-size="9">if messages remain</text>
  </g>

  <!-- boxes -->
  <g filter="url(#shadow)" stroke="black" stroke-width="1" fill="white">
    <rect x="304" y="4" width="90" height="36"/>
    <rect x="440" y="4" width="90" height="36"/>
    <rect x="372" y="96" width="90" height="36"/>
    <rect x="372" y="200" width="90" height="36"/>
    <rect x="168" y="330" width="90" height="36"/>
    <rect x="304" y="330" width="90" height="36"/>
    <rect x="440" y="330" width="90" height="36"/>
    <rect x="576" y="330" width="90" height="36"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="black">
    <text x="349" y="19">Dispatcher</text>
    <text x="349" y="33">Worker</text>
    <text x="485" y="19">Dispatcher</text>
    <text x="485" y="33">Worker</text>
    <text x="417" y="118">Dispatcher</text>
    <text x="417" y="215">Actor /</text>
    <text x="417" y="229">Receiver</text>
    <text x="213" y="345">Actor /</text>
    <text x="213" y="359">sender</text>
    <text x="349" y="345">Actor /</text>
    <text x="349" y="359">sender</text>
    <text x="485" y="345">Actor /</text>
    <text x="485" y="359">sender</text>
    <text x="621" y="345">Actor /</text>
    <text x="621" y="359">sender</text>
  </g>
</svg>
